version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: import_data_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-import_data}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - import-data-network

  redis:
    image: redis:7-alpine
    container_name: import_data_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - import-data-network

  app:
    build: .
    container_name: import_data_app
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-import_data}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-9261a8f94c483f8e5d36e7681146313b}
      NEXTAUTH_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - import-data-network

  nginx:
    image: nginx:1.25-alpine
    container_name: import_data_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - import-data-network

networks:
  import-data-network:
    driver: bridge

volumes:
  postgres_data:
